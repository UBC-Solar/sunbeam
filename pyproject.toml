[project]
name = "sunbeam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"

[project.optional-dependencies]
broker = [
    "coolname>=5.0.0",
    "docker>=7.1.0",
    "fastapi>=0.138.0",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "pydantic>=2.13.4",
    "pyzmq>=27.1.0",
    "sqlalchemy>=2.0.49",
    "ubc-solar-data-tools",
    "uvicorn>=0.49.0",
]
executor = [
    "networkx>=3.6.1",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "ubc-solar-data-tools>=2.0.1",
]
v3_0 = [
    "influxdb-client>=1.50.0",
    "psycopg>=3.3.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
v3_1 = []

[tool.uv]
conflicts = [
    [
      { extra = "v3_0" },
      { extra = "v3_1" },
    ],
    [
        { extra = "broker"},
        { extra = "executor"}
    ]
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
