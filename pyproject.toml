[project]
name = "sunbeam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"

[project.optional-dependencies]
broker = [
    "coolname>=5.0.0",
    "docker>=7.1.0",
    "fastapi>=0.138.0",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "pydantic>=2.13.4",
    "pyzmq>=27.1.0",
    "sqlalchemy>=2.0.49",
    "ubc-solar-data-tools",
    "uvicorn>=0.49.0",
]
executor = [
    "networkx>=3.6.1",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "ubc-solar-data-tools",
]
v3_0 = [
    "influxdb-client>=1.50.0",
    "psycopg>=3.3.4",
]
v3_1 = []

[tool.uv.sources]
ubc-solar-data-tools = { git = "https://github.com/UBC-Solar/data_tools.git", rev = "e2d3e4bee849171a70e4f227a03819ab2e288934" }

[tool.uv]
conflicts = [
    [
      { extra = "v3_0" },
      { extra = "v3_1" },
    ],
    [
        { extra = "broker"},
        { extra = "executor"}
    ]
]
