[project]
name = "sunbeam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "requests>=2.33",
    "sqlalchemy>=2.0.49",
    "ubc-solar-data-tools>=2.0.2",
]

# server and executor keep each Docker image lean. Each pipeline edition also has its own extra, installed on top of
# executor in that edition's worker image, so editions can depend on conflicting versions (see [tool.uv] conflicts).
[project.optional-dependencies]
server = [
    "alembic>=1.16",
    "docker>=7.1.0",
    "fastapi>=0.138.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
]
executor = [
    "networkx>=3.6.1",
    "rich>=15.0.0",
    "scipy>=1.17",
]
v3_0 = [
    "psycopg>=3.3.4",
]
v3_1 = []
v4_0 = [
    "ubc-solar-data-tools>=2.0.2",
    "psycopg>=3.3.4",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "httpx2>=0.1",
    "testcontainers>=4.8",
]
dev = [
    "ruff>=0.14",
    "mypy>=1.19",
]

[tool.uv]
conflicts = [
    [
      { extra = "v3_0" },
      { extra = "v3_1" },
    ],
]

[tool.uv.sources]
ubc-solar-data-tools = { git = "https://github.com/UBC-Solar/data_tools.git", branch = "sunbeam_update" }

[tool.ruff]
line-length = 120
extend-exclude = ["dashboard", "data"]

[tool.ruff.lint.per-file-ignores]
# Constants must be defined before the submodule imports that read them back.
"config/__init__.py" = ["E402"]
# Re-exports.
"**/__init__.py" = ["F401"]
# Imports legitimately follow pytest.importorskip(...) guards.
"tests/**" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
implicit_optional = true
check_untyped_defs = true
explicit_package_bases = true
exclude = ["dashboard/", "data/", "build/"]

[[tool.mypy.overrides]]
# Tests deliberately pass fakes where concrete types are declared and lean on
# assertions rather than narrowing; keep them checked but not pedantic.
module = "tests.*"
disable_error_code = [
    "union-attr",
    "arg-type",
    "list-item",
    "var-annotated",
    "return-value",
    "operator",
    "assignment",
    "index",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: needs a real Postgres via Docker; excluded by default, run with `pytest -m postgres`",
]
addopts = "-m 'not postgres'"
