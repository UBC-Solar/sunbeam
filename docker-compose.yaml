services:
  db:
    networks:
      - sunbeam-net
    image: timescale/timescaledb:2.14.2-pg16
    container_name: sunbeam-db
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    networks:
      - sunbeam-net
    container_name: sunbeam-server
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      # Which context.toml profile the server loads, and the default for workers it launches. Set it in the
      # shell (`SUNBEAM_CONFIGURATION_PROFILE=production docker compose up`) or in a .env file next to this one;
      # unset means context.toml's [main].default_config.
      SUNBEAM_CONFIGURATION_PROFILE: ${SUNBEAM_CONFIGURATION_PROFILE:-}
    depends_on:
      - db
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dashboard:
    networks:
      - sunbeam-net
    container_name: sunbeam-dashboard
    init: true
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # The Vite dev server proxies /api to this, so the dashboard works from whatever host serves it.
      SUNBEAM_API_PROXY_TARGET: http://server:8000
    depends_on:
      - server

volumes:
  telemetry_db_data:

networks:
  sunbeam-net:
    name: sunbeam-net